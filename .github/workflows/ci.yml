name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Função de servidor e regras da lista de compras
        run: npm test
      - name: Navegador para os testes de ponta a ponta
        run: npx playwright install --with-deps chromium
      - name: Busca, semana e lista de compras (Spoonacular simulado)
        run: npm run test:e2e
      - name: Guardar o rastro dos testes que falharam
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: test-results/
          retention-days: 7
